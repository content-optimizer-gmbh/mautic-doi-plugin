jw.doi.integration.linkscanner.note="<strong>Schutz vor Link-Scannern (Reiter Funktionen):</strong> Die Option wirkt nur, wenn dieses Plugin oben auf Veröffentlicht steht, und nur mit einem asynchronen Messenger-Transport und einem laufenden Worker. In config/local.php muss <code>messenger_dsn_jotaworks_doi</code> z. B. auf <code>doctrine://default?queue_name=jotaworks_doi</code> stehen und per Cron/Supervisor <code>bin/console messenger:consume jotaworks_doi</code> laufen. Mit dem Standard <code>sync://</code> gibt es keine Wartezeit, und ohne Worker werden Bestätigungen nie übernommen. Die DOI-Mail braucht außerdem den unsichtbaren Köder-Link {doi_nothuman}. Details: README.md des Plugins."
