jw.doi.integration.linkscanner.protection.tooltip="The confirmation is applied only after the delay and is discarded if the hidden bait link {doi_nothuman} of the same email was requested. Default: off."
jw.doi.integration.linkscanner.delay="Delay in seconds"
jw.doi.integration.linkscanner.delay.tooltip="How long the plugin waits after the click on the confirmation link before it checks the bait link (default 60, max. 3600)."
jw.doi.integration.linkscanner.note="<strong>Link scanner protection (Features tab):</strong> The option only works when this plugin is published (above) and only with an asynchronous messenger transport and a running worker. Set <code>messenger_dsn_jotaworks_doi</code> in config/local.php e.g. to <code>doctrine://default?queue_name=jotaworks_doi</code> and run <code>bin/console messenger:consume jotaworks_doi</code> via cron/supervisor. With the default <code>sync://</code> there is no delay, and without a worker confirmations are never applied. The DOI email also needs the hidden bait link {doi_nothuman}. Details: README.md of the plugin."
